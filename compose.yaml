services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/db_data
        target: /var/lib/mysql
      - type: bind
        source: ${WSL_PROJECT_DIR:-.}/init
        target: /docker-entrypoint-initdb.d
    #ports:
    #  - "3306:3306"

  # db-console:
  #   image: mariadb:latest
  #   container_name: console
  #   depends_on:
  #     - db
  #   stdin_open: true
  #   tty: true
  #   command: ["sh", "-c", "trap 'exit 0' INT; sleep infinity"]

  path-loader:
    build: ./path_loader
    container_name: path-loader
    depends_on:
      - db
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/app_state
        target: /app_state
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/img_src
        target: /img_src
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/img_db_thumbs
        target: /img_db_thumbs
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/blogs
        target: /blogs
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/about
        target: /about
    environment:
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
    command: ["python", "/app/load_paths.py"]

  thumbnail-service:
    build: ./thumbnail_service
    container_name: thumbnail-service
    restart: unless-stopped
    environment:
      THUMBNAIL_SERVICE_PORT: ${THUMBNAIL_SERVICE_PORT:-8080}
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/img_db_thumbs
        target: /img_db_thumbs
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"THUMBNAIL_SERVICE_PORT\", \"8080\")}/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  website:
    build: ./website
    container_name: website
    depends_on:
      path-loader:
        condition: service_started
      thumbnail-service:
        condition: service_healthy
    ports:
      - "${WEBSITE_PORT}:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      DataProtection__KeysPath: /app_state/data-protection-keys
      ThumbnailService__BaseAddress: http://thumbnail-service:${THUMBNAIL_SERVICE_PORT:-8080}/
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=mydb;User=myuser;Password=mypassword;"
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/app_state
        target: /app_state
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/img_src
        target: /img_src
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/img_db_thumbs
        target: /img_db_thumbs
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/admin
        target: /app/admin
        read_only: true
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/about
        target: /about
