services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}/db_data
        target: /var/lib/mysql
      - type: bind
        source: ${WSL_PROJECT_DIR:-.}/init
        target: /docker-entrypoint-initdb.d
    #ports:
    #  - "3306:3306"

  # db-console:
  #   image: mariadb:latest
  #   container_name: console
  #   depends_on:
  #     - db
  #   stdin_open: true
  #   tty: true
  #   command: ["sh", "-c", "trap 'exit 0' INT; sleep infinity"]

  path-loader:
    build: ./path_loader
    container_name: path-loader
    depends_on:
      - db
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}
        target: ${FILE_STORAGE_ROOT:-/data}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      PATH_LOADER_FAST: ${PATH_LOADER_FAST:-false}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DIMDOCK_DATA_ROOT: ${FILE_STORAGE_ROOT:-/data}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-Local}
      LINODE_STORAGE_ENDPOINT: ${LINODE_STORAGE_ENDPOINT:-}
      LINODE_STORAGE_REGION: ${LINODE_STORAGE_REGION:-}
      LINODE_STORAGE_BUCKET: ${LINODE_STORAGE_BUCKET:-}
      LINODE_STORAGE_PREFIX: ${LINODE_STORAGE_PREFIX:-}
      LINODE_STORAGE_ACCESS_KEY: ${LINODE_STORAGE_ACCESS_KEY:-}
      LINODE_STORAGE_SECRET_KEY: ${LINODE_STORAGE_SECRET_KEY:-}
    command: ["python", "/app/load_paths.py"]

  thumbnail-service:
    build: ./thumbnail_service
    container_name: thumbnail-service
    restart: unless-stopped
    environment:
      THUMBNAIL_SERVICE_PORT: ${THUMBNAIL_SERVICE_PORT:-8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"THUMBNAIL_SERVICE_PORT\", \"8080\")}/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  website:
    build: ./website
    container_name: website
    depends_on:
      path-loader:
        condition: service_completed_successfully
      thumbnail-service:
        condition: service_healthy
    ports:
      - "${WEBSITE_PORT}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:80
      Development__AllowAnyAdminPassword: ${DEV_ALLOW_ANY_ADMIN_PASSWORD:-false}
      AdminAuth__Username: ${ADMIN_USERNAME:-}
      AdminAuth__Password: ${ADMIN_PASSWORD:-}
      DataProtection__KeysPath: ${FILE_STORAGE_ROOT:-/data}/app_state/data-protection-keys
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-Local}
      FileStorage__RootPath: ${FILE_STORAGE_ROOT:-/data}
      LinodeStorage__Endpoint: ${LINODE_STORAGE_ENDPOINT:-}
      LinodeStorage__Region: ${LINODE_STORAGE_REGION:-}
      LinodeStorage__Bucket: ${LINODE_STORAGE_BUCKET:-}
      LinodeStorage__Prefix: ${LINODE_STORAGE_PREFIX:-}
      LinodeStorage__AccessKey: ${LINODE_STORAGE_ACCESS_KEY:-}
      LinodeStorage__SecretKey: ${LINODE_STORAGE_SECRET_KEY:-}
      Uploads__Mode: ${UPLOAD_MODE:-Chunked}
      Uploads__BypassHost: ${UPLOAD_BYPASS_HOST:-}
      Uploads__MainSiteUrl: ${MAIN_SITE_URL:-https://dimdock.com}
      Uploads__ChunkSizeMB: ${UPLOAD_CHUNK_SIZE_MB:-50}
      Database__Host: db
      Database__Port: "3306"
      Database__Name: ${DB_NAME:?Set DB_NAME in .env}
      Database__User: ${DB_USER:?Set DB_USER in .env}
      Database__Password: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ThumbnailService__BaseAddress: http://thumbnail-service:${THUMBNAIL_SERVICE_PORT:-8080}/
    volumes:
      - type: bind
        source: ${WSL_DATA_DIR:-${DATA_DIR}}
        target: ${FILE_STORAGE_ROOT:-/data}
