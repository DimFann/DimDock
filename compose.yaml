services:
  db:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - type: bind
        source: ${DATA_DIR}/db_data
        target: /var/lib/mysql
      - type: bind
        source: ./init
        target: /docker-entrypoint-initdb.d
    #ports:
    #  - "3306:3306"

  # db-console:
  #   image: mariadb:latest
  #   container_name: console
  #   depends_on:
  #     - db
  #   stdin_open: true
  #   tty: true
  #   command: ["sh", "-c", "trap 'exit 0' INT; sleep infinity"]

  path-loader:
    build: ./path_loader
    container_name: path-loader
    depends_on:
      - db
    volumes:
      - type: bind
        source: ${DATA_DIR}/app_state
        target: /app_state
      - type: bind
        source: ${DATA_DIR}/img_src
        target: /img_src
      - type: bind
        source: ${DATA_DIR}/img_db_thumbs
        target: /img_db_thumbs
    environment:
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
    command: ["python", "/app/load_paths.py"]

  website:
    build: ./website
    container_name: website
    depends_on:
      - path-loader
    ports:
      - "${WEBSITE_PORT}:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=mydb;User=myuser;Password=mypassword;"
    volumes:
      - type: bind
        source: ${DATA_DIR}/app_state
        target: /app_state
      - type: bind
        source: ${DATA_DIR}/img_src
        target: /img_src
      - type: bind
        source: ${DATA_DIR}/img_db_thumbs
        target: /img_db_thumbs
